name: FVG Signal

on:
  schedule:
    - cron: "*/5 0-9 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send test message only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fvg-signal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas numpy

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            python fvg_signal.py --test
          else
            python fvg_signal.py
          fi

      - name: Save state
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
